name: webrtc_call_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.2.1
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.0

  flutter_webrtc: ^1.3.1
  speech_to_text: ^7.3.0
  flutter_svg: ^2.0.10
  web_socket_channel: ^3.0.3
  record: ^6.2.0
  flutter_tts: ^4.2.5
  http: ^1.6.0
  image_picker: ^1.2.1
  firebase_storage: ^13.1.0
  google_sign_in: ^6.2.1
  cloud_functions: ^6.0.7
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  http_parser: ^4.0.2
  flutter_dotenv: ^6.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  flutter_launcher_icons: ^0.13.1

# 🔥 LAUNCHER ICON CONFIG
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/new_logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/new_logo.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/